<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKYO PACK 行程規劃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#faf8f4;
  --surface:#ffffff;
  --surface-2:#f1ede4;
  --border:#ddd5c6;
  --ink:#241f18;
  --ink-2:#5c5342;
  --ink-3:#8a8070;
  --accent:#b5502e;
  --accent-ink:#ffffff;
  --accent-soft:#f3ddd2;
  --good:#4c7a52;
  --good-soft:#dfe9de;
  --bad:#b23b3b;
  --bad-soft:#f3dcdc;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1812;
    --surface:#26221b;
    --surface-2:#302b22;
    --border:#453e30;
    --ink:#f3ede1;
    --ink-2:#c9bfab;
    --ink-3:#948a76;
    --accent:#e08659;
    --accent-ink:#241209;
    --accent-soft:#3a2a20;
    --good:#7fbf88;
    --good-soft:#28352a;
    --bad:#e08080;
    --bad-soft:#3a2424;
  }
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","Hiragino Sans","PingFang TC",system-ui,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px;display:flex;flex-direction:column;gap:20px;}

/* ---- top nav ---- */
.topnav{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding-block:10px;padding-inline:16px;
  border-bottom:1px solid var(--border);
}
.topnav-inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.brand h1{font-family:"Noto Serif TC",serif;font-size:clamp(18px,4vw,22px);margin:0;}
.pagetabs{display:flex;gap:6px;flex-wrap:wrap;}
.pagetab{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
  padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.pagetab .num{
  width:18px;height:18px;border-radius:100%;background:var(--surface-2);color:var(--ink-3);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;
}
.pagetab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
.pagetab[aria-selected="true"] .num{background:var(--accent);color:var(--accent-ink);}

.page-panel{display:none;flex-direction:column;gap:18px;}
.page-panel[data-active="true"]{display:flex;}

header.page{display:flex;flex-direction:column;gap:4px;}
header.page .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;}
header.page h2{font-family:"Noto Serif TC",serif;font-size:clamp(20px,4.5vw,26px);margin:0;}
header.page p{margin:0;color:var(--ink-2);font-size:13.5px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
.card h3{font-size:15px;margin:0 0 8px;font-family:"Noto Serif TC",serif;}
.meta{font-size:12px;color:var(--ink-3);}

.notebox{background:var(--good-soft);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2);}
.notebox strong{color:var(--ink);}
.notebox.warn{background:var(--bad-soft);}
.notebox.warn strong{color:var(--bad);}

/* ---------------- PAGE 1: hotel compare ---------------- */
.hotel-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.hotel-grid{grid-template-columns:repeat(3,1fr);}}
.hotel-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:10px;position:relative;
}
.hotel-card.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.hotel-card .plan-badge{
  align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.04em;
  color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:100px;
}
.hotel-card.sold-out{opacity:.55;}
.hotel-card h4{margin:0;font-size:16px;font-family:"Noto Serif TC",serif;line-height:1.35;}
.hotel-card .area{font-size:12px;color:var(--ink-3);}
.price-block{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.price-block .amt{font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
.price-block .unit{font-size:12px;color:var(--ink-3);}
.price-note{font-size:11.5px;color:var(--ink-3);margin-top:-6px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;}
.tag{
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:100px;
  display:inline-flex;align-items:center;gap:4px;
}
.tag.good{background:var(--good-soft);color:var(--good);}
.tag.bad{background:var(--bad-soft);color:var(--bad);}
.tag.neutral{background:var(--surface-2);color:var(--ink-2);}
.detail-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.detail-chip{
  font-size:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);
  overflow:hidden;
}
.detail-chip summary{
  list-style:none;cursor:pointer;padding:6px 10px;color:var(--ink-2);font-weight:600;
  display:flex;align-items:center;gap:4px;white-space:normal;word-break:break-word;
}
.detail-chip summary::-webkit-details-marker{display:none;}
.detail-chip summary::before{content:"+";color:var(--accent);font-weight:800;flex:none;}
.detail-chip[open] summary::before{content:"−";}
.detail-chip[open] summary{color:var(--ink);border-bottom:1px solid var(--border);}
.detail-chip-body{padding:8px 10px;font-size:12px;color:var(--ink-2);line-height:1.5;word-break:break-word;}
.map-link-btn{
  margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);
  border-radius:10px;padding:8px 10px;text-decoration:none;
}
.map-link-btn:hover{background:var(--accent-soft);}
.map-link-btn svg{width:15px;height:15px;flex:none;}
.sold-out-strip{
  font-size:12px;font-weight:800;color:var(--bad);background:var(--bad-soft);
  padding:6px 10px;border-radius:8px;text-align:center;
}

/* ---------------- PAGE 2: route map ---------------- */
.hotel-toggle{display:flex;gap:8px;flex-wrap:wrap;}
.hotel-btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
  padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;flex:1;min-width:160px;text-align:left;
  font-family:inherit;
}
.hotel-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
.hotel-btn .sub{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:2px;}
.hotel-btn[aria-pressed="true"] .sub{color:var(--ink-2);}

.daytabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.daytab{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
  padding:8px 13px;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;cursor:pointer;
  border-bottom:none;position:relative;top:1px;font-family:inherit;
}
.daytab[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:0 -2px 0 var(--accent) inset;}

.route-split{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:760px){.route-split{grid-template-columns:1.05fr 0.95fr;align-items:start;}}
.map-col{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface);}
.map-col iframe{width:100%;height:300px;border:0;display:block;}
.map-caption{padding:9px 14px;font-size:12px;color:var(--ink-2);background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;}
.map-caption span{flex:1;min-width:0;word-break:break-word;}
.map-caption a{color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap;}
.map-caption a:hover{text-decoration:underline;}

.info-col{display:flex;flex-direction:column;gap:12px;}
.day-heading{display:flex;flex-direction:column;gap:2px;}
.day-heading h3{margin:0;font-size:17px;font-family:"Noto Serif TC",serif;}
.day-heading .sub{font-size:12.5px;color:var(--ink-3);}
.fixed-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  color:var(--accent-ink);background:var(--accent);padding:3px 9px;border-radius:100px;align-self:flex-start;
}

.route-list{display:flex;flex-direction:column;gap:0;}
.rstop{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);cursor:pointer;}
.rstop:first-child{border-top:none;}
.rstop:hover{background:var(--surface-2);margin-inline:-10px;padding-inline:10px;border-radius:10px;}
.rstop.active{background:var(--accent-soft);margin-inline:-10px;padding-inline:10px;border-radius:10px;}
.rstop .idx{
  width:24px;height:24px;border-radius:100%;background:var(--surface-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;margin-top:1px;
}
.rstop.active .idx{background:var(--accent);color:var(--accent-ink);}
.rstop .rbody{flex:1;min-width:0;}
.rstop .rrow1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;}
.rstop .rname{font-weight:700;font-size:13.5px;}
.rstop .rtime{font-size:11.5px;color:var(--accent);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.rstop .rnote{font-size:12.5px;color:var(--ink-2);margin-top:2px;}
.rstop .rhours{font-size:11px;color:var(--ink-3);margin-top:2px;}

.transit-chip{
  display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-3);
  padding:6px 0 6px 34px;
}
.transit-chip svg{width:14px;height:14px;flex:none;color:var(--ink-3);margin-top:1px;}
.transit-chip span{flex:1;min-width:0;}
.transit-chip b{color:var(--ink-2);font-weight:700;white-space:normal;}

/* ---------------- PAGE 3: transit + prep ---------------- */
.transit-table{width:100%;border-collapse:collapse;font-size:13px;}
.transit-table th,.transit-table td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.transit-table th{color:var(--ink-3);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.transit-table td.num{font-variant-numeric:tabular-nums;white-space:nowrap;}
.transit-table .planbadge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:100px;background:var(--accent-soft);color:var(--accent);display:inline-block;}
.tblwrap{overflow-x:auto;}
.tbl-hint{font-size:11px;color:var(--ink-3);margin:-4px 0 2px;}
@media(min-width:640px){.tbl-hint{display:none;}}

.prep-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.prep-grid{grid-template-columns:repeat(2,1fr);}}
.prep-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.prep-card .phead{display:flex;align-items:center;gap:8px;}
.prep-icon{
  width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.prep-icon svg{width:17px;height:17px;}
.prep-card h4{margin:0;font-size:14.5px;font-family:"Noto Serif TC",serif;}
.prep-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.prep-list li{font-size:13px;color:var(--ink-2);display:flex;gap:7px;}
.prep-list li::before{content:"✓";color:var(--good);font-weight:800;flex:none;}
.prep-list li>span{flex:1;min-width:0;word-break:break-word;}
.prep-list strong{color:var(--ink);white-space:normal;}

/* ---------------- PAGE 4: work assignment (simple) ---------------- */
.work-grid-simple{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:720px){.work-grid-simple{grid-template-columns:repeat(3,1fr);}}
.person-card-simple{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
}
.avatar{
  width:34px;height:34px;border-radius:100%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;
}
.person-card-simple h4{margin:0;font-size:16px;font-family:"Noto Serif TC",serif;}
.kw-row{display:flex;flex-wrap:wrap;gap:6px;}
.kw{font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;background:var(--surface-2);color:var(--ink-2);}


/* ---------------- hotel detail + flights ---------------- */
.info-rows{display:flex;flex-direction:column;}
.info-row{padding:12px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px;}
.info-row:first-child{border-top:none;}
.info-row .k{font-size:12px;color:var(--ink-3);font-weight:600;}
.info-row .v{font-size:14.5px;color:var(--ink);word-break:break-word;}
.src-tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:100px;background:var(--surface-2);color:var(--ink-3);margin-left:6px;white-space:nowrap;vertical-align:middle;}
.src-tag.todo{background:var(--bad-soft);color:var(--bad);}
.hotel-detail{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:760px){.hotel-detail{grid-template-columns:1.05fr .95fr;align-items:start;}}
.hotel-head{display:flex;flex-direction:column;gap:4px;}
.hotel-head h3{font-size:19px;margin:0;font-family:"Noto Serif TC",serif;}
.hotel-head .area{font-size:12.5px;color:var(--ink-3);}
.flight-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.flight-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.flight-top .dir{font-size:12px;font-weight:800;color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:100px;}
.flight-top .date{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;}
.flight-route{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;}
.flight-route .pt .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
.flight-route .pt .c{font-size:13px;font-weight:700;}
.flight-route .pt .n{font-size:12px;color:var(--ink-3);}
.flight-route .pt.r{text-align:right;}
.flight-route .mid{font-size:12px;color:var(--ink-3);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;}
.flight-route .mid .line{width:44px;height:2px;background:var(--border);}
.flight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;}
@media(min-width:640px){.flight-grid{grid-template-columns:repeat(3,1fr);}}
.flight-grid .k{font-size:11.5px;color:var(--ink-3);}
.flight-grid .v{font-size:13.5px;font-weight:600;}
.flight-grid .v.ok{color:var(--good);}
.flight-split{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:760px){.flight-split{grid-template-columns:repeat(2,1fr);}}

footer.note{font-size:12px;color:var(--ink-3);text-align:center;padding-top:6px;}
</style>
</head>

// 建立 Google Maps Embed API 的 iframe 網址。
// - 有 activeStop：聚焦單一景點（place 模式）
// - 無 activeStop 且當天有 >=1 個有座標的停留站：畫出「飯店 → 各站依序 → 飯店」的完整路線（directions 模式）
// - 當天完全沒有座標（抵達日／回程日）：退回顯示飯店位置（place 模式）
function buildMapEmbedSrc(day, hotel, activeStop){
  var base = "https://www.google.com/maps/embed/v1/";
  if(activeStop && activeStop.lat!=null){
    return base+"place?key="+GMAPS_API_KEY+"&q="+activeStop.lat+","+activeStop.lng+"&zoom=16";
  }
  if(day.dir){
    var ap = encodeURIComponent(day.stops[0].q);
    var hp = hotel.lat+","+hotel.lng;
    return base+"directions?key="+GMAPS_API_KEY+
      "&origin="+(day.dir==="in"?ap:hp)+"&destination="+(day.dir==="in"?hp:ap)+"&mode=transit";
  }
  var validStops = (day.stops||[]).filter(function(s){ return s.lat!=null; });
  if(validStops.length===0){
    return base+"place?key="+GMAPS_API_KEY+"&q="+hotel.lat+","+hotel.lng+"&zoom=15";
  }
  if(validStops.length===1){
    // 只有一站：畫「飯店 → 該站 → 飯店」來回路線
    var only = validStops[0];
    return base+"directions?key="+GMAPS_API_KEY+
      "&origin="+hotel.lat+","+hotel.lng+
      "&destination="+hotel.lat+","+hotel.lng+
      "&waypoints="+only.lat+","+only.lng+
      "&mode=transit";
  }
  var origin = hotel.lat+","+hotel.lng;
  var destination = hotel.lat+","+hotel.lng;
  var waypoints = validStops.map(function(s){ return s.lat+","+s.lng; }).join("|");
  return base+"directions?key="+GMAPS_API_KEY+
    "&origin="+origin+
    "&destination="+destination+
    "&waypoints="+encodeURIComponent(waypoints)+
    "&mode=transit";
}

function renderPage2(){
  var wrap = el("div","page-panel");
  wrap.id = "panel-3";

  var head = el("header","page",
    '<span class="kicker">Step 3 · 路線規劃</span><h2>每日路線地圖</h2>' +
    '<p>以 APA Hotel 東京大島為起訖點。點選景點可在地圖上顯示位置。</p>');
  wrap.appendChild(head);

  // day tabs
  var daytabs = el("div","daytabs");
  DAYS.forEach(function(day){
    var t = el("button","daytab", day.label);
    t.type="button";
    t.setAttribute("aria-selected", String(day.id===currentDayId));
    t.onclick = function(){ currentDayId = day.id; currentStopId=null; renderAll(); };
    daytabs.appendChild(t);
  });
  wrap.appendChild(daytabs);

  var day = null;
  DAYS.forEach(function(d){ if(d.id===currentDayId) day = d; });

  var split = el("div","route-split");

  // map col
  var mapCol = el("div","map-col");
  var activeStop = currentStopId ? findStopById(currentStopId) : null;
  var hotelObj = HOTEL;
  var mapLabel, mapUrl;
  var validStopCount = day.dir ? 0 : (day.stops||[]).filter(function(s){ return s.lat!=null; }).length;
  if(activeStop && activeStop.lat!=null){
    mapLabel=activeStop.mapLabel; mapUrl=activeStop.mapUrl;
  } else if(validStopCount>0){
    mapLabel="飯店 → "+day.title+"（全程路線）"; mapUrl=hotelObj.mapUrl;
  } else if(day.dir){
    mapLabel = day.dir==="in" ? "羽田機場 → 飯店（大眾運輸）" : "飯店 → 羽田機場（大眾運輸）"; mapUrl=day.stops[0].mapUrl;
  } else {
    mapLabel=hotelObj.label; mapUrl=hotelObj.mapUrl;
  }
  var iframe = document.createElement("iframe");
  iframe.loading="lazy";
  iframe.referrerPolicy="no-referrer-when-downgrade";
  iframe.src = buildMapEmbedSrc(day, hotelObj, activeStop);
  mapCol.appendChild(iframe);
  var capInner = '<span>目前顯示：<strong>'+mapLabel+'</strong></span>';
  if(activeStop && validStopCount>0){
    capInner += '<a href="javascript:void(0)" class="show-route-link">顯示完整路線</a>';
  }
  capInner += '<a href="'+mapUrl+'" target="_blank" rel="noopener">在 Google 地圖 App 開啟 ↗</a>';
  var cap = el("div","map-caption", capInner);
  var routeLink = cap.querySelector(".show-route-link");
  if(routeLink){
    routeLink.onclick = function(){ currentStopId = null; renderAll(); };
  }
  mapCol.appendChild(cap);
  split.appendChild(mapCol);

  // info col
  var infoCol = el("div","info-col");

  var dh = el("div","day-heading",
    '<h3>'+day.title+'</h3><div class="sub">'+day.sub+'</div>');
  if(day.fixed){
    var fb = el("span","fixed-badge","展覽固定行程");
    dh.appendChild(fb);
  }
  infoCol.appendChild(dh);

  // transit from hotel (if applicable)
  if(day.transitFromHotel){
    var tf = day.transitFromHotel;
    var chip = el("div","transit-chip",
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>' +
      '<span>飯店出發 → 第一站：<b>'+tf.mode+'・'+tf.time+(tf.transfer?'・'+tf.transfer:'')+'</b></span>');
    chip.style.paddingLeft = "0";
    infoCol.appendChild(chip);
  }

  var list = el("div","route-list");
  day.stops.forEach(function(stop, idx){
    var row = el("div","rstop" + (stop.id===currentStopId?" active":""));
    row.appendChild(el("div","idx", String(idx+1)));
    var body = el("div","rbody");
    var row1 = el("div","rrow1",
      '<span class="rname">'+stop.name+'</span>' + (stop.time?'<span class="rtime">'+stop.time+'</span>':''));
    body.appendChild(row1);
    if(stop.note) body.appendChild(el("div","rnote",stop.note));
    if(stop.hours) body.appendChild(el("div","rhours","營業時間："+stop.hours));
    row.appendChild(body);
    if(stop.lat!=null){
      row.onclick = function(){ currentStopId = stop.id; renderAll(); };
    }
    list.appendChild(row);

    if(stop.transitIn && stop.transitIn.mode){
      var tc = el("div","transit-chip",
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>' +
        '<span>前往此站：<b>'+stop.transitIn.mode+(stop.transitIn.time?'・'+stop.transitIn.time:'')+(stop.transitIn.transfer?'・'+stop.transitIn.transfer:'')+'</b></span>');
      list.appendChild(tc);
    }
  });
  infoCol.appendChild(list);

  if(day.transitToHotel){
    var tt = day.transitToHotel;
    var chip2 = el("div","transit-chip",
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>' +
      '<span>最後一站 → 返回飯店：<b>'+tt.mode+'・'+tt.time+(tt.transfer?'・'+tt.transfer:'')+'</b></span>');
    chip2.style.paddingLeft = "0";
    infoCol.appendChild(chip2);
  }

  split.appendChild(infoCol);
  wrap.appendChild(split);

  return wrap;
}

/* ---------- PAGE 3 ---------- */
function renderPage3(){
  var wrap = el("div","page-panel");
  wrap.id = "panel-4";

  var head = el("header","page",
    '<span class="kicker">Step 4 · 交通與行前準備</span><h2>交通方式總表 ＋ 行前準備清單</h2>' +
    '<p>下表彙整各路段以大島為據點的交通方式；下方為出發前建議準備事項。</p>');
  wrap.appendChild(head);

  var tableCard = el("div","card");
  tableCard.appendChild(el("h3","","路段交通總表"));
  tableCard.appendChild(el("div","tbl-hint","← 手機請左右滑動表格以查看完整欄位 →"));
  var tblwrap = el("div","tblwrap");
  var table = el("table","transit-table");
  var thead = el("thead",null,
    '<tr><th>路段</th><th><span class="planbadge">以大島為據點</span></th></tr>');
  table.appendChild(thead);
  var tbody = el("tbody");
  TRANSIT_ROWS.forEach(function(r){
    var tr = el("tr",null,
      '<td>'+r.seg+'</td><td class="num">'+r.t+'</td>');
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tblwrap.appendChild(table);
  tableCard.appendChild(tblwrap);
  wrap.appendChild(tableCard);

  wrap.appendChild(el("div","notebox",
    "<strong>確定的：</strong>以上時間皆為實際查詢日間班次電車路線後所得的參考值。<strong>推測的：</strong>實際交通時間會依當天班次、尖峰壅塞、轉乘走路速度略有增減，建議抓 ±5–10 分鐘彈性。"));

  wrap.appendChild(el("header","page","<h2 style=\"font-size:20px;margin-top:4px;\">行前準備清單</h2>"));
  var prepGrid = el("div","prep-grid");
  PREP.forEach(function(p){
    var card = el("div","prep-card");
    var phead = el("div","phead",
      '<div class="prep-icon">'+p.icon+'</div><h4>'+p.title+'</h4>');
    card.appendChild(phead);
    var ul = el("ul","prep-list");
    p.items.forEach(function(it){ ul.appendChild(el("li",null,"<span>"+it+"</span>")); });
    card.appendChild(ul);
    prepGrid.appendChild(card);
  });
  wrap.appendChild(prepGrid);

  return wrap;
}

/* ---------- PAGE 4 ---------- */
function renderPage4(){
  var wrap = el("div","page-panel");
  wrap.id = "panel-5";

  var head = el("header","page",
    '<span class="kicker">Step 5 · 展場分工（提案階段）</span><h2>3 人・3 條主線</h2>' +
    '<p>尚未定案，僅列主軸方向與關鍵字供討論。</p>');
  wrap.appendChild(head);

  var grid = el("div","work-grid-simple");
  WORK.forEach(function(w,i){
    var card = el("div","person-card-simple");
    var whoRow = el("div",null,'<div class="avatar">'+String.fromCharCode(65+i)+'</div>');
    whoRow.style.display="flex";whoRow.style.gap="10px";whoRow.style.alignItems="center";
    var nameWrap = el("div",null,'<div style="font-size:12px;color:var(--ink-3);">'+w.who+'</div><h4>'+w.topic+'</h4>');
    whoRow.appendChild(nameWrap);
    card.appendChild(whoRow);
    var kwRow = el("div","kw-row");
    w.kws.forEach(function(k){ kwRow.appendChild(el("span","kw",k)); });
    card.appendChild(kwRow);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  wrap.appendChild(el("div","notebox",
    "<strong>備註：</strong>三條主線為提案階段的方向草案，尚未定案，實際分工與細項可於出發前或現場再行調整。"));

  return wrap;
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
var PAGES = [
  {n:1, label:"飯店資訊", render:renderPage1},
  {n:2, label:"機票資訊", render:renderFlights},
  {n:3, label:"路線規劃", render:renderPage2},
  {n:4, label:"交通與準備", render:renderPage3},
  {n:5, label:"分工提案", render:renderPage4}
];

function renderAll(){
  var tabsEl = document.getElementById("pageTabs");
  var panelsEl = document.getElementById("pagePanels");
  tabsEl.innerHTML = "";
  panelsEl.innerHTML = "";

  PAGES.forEach(function(p){
    var btn = el("button","pagetab",'<span class="num">'+p.n+'</span>'+p.label);
    btn.type="button";
    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", String(p.n===currentPage));
    btn.onclick = function(){ currentPage = p.n; renderAll(); };
    tabsEl.appendChild(btn);
  });

  PAGES.forEach(function(p){
    var panel = p.render();
    panel.setAttribute("data-active", String(p.n===currentPage));
    panelsEl.appendChild(panel);
  });

  window.scrollTo({top:0, behavior:"instant"});
}

renderAll();

})();
</script>
